name: Build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Run unit tests
        run: >-
          ./gradlew
          :shared:domain:jvmTest
          :shared:data:jvmTest
          :shared:ui:testAndroidHostTest
          :feature:restaurantHome:jvmTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  e2e:
    name: Restaurant and review end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Install Supabase CLI
        run: npm ci

      - name: Start and seed local Supabase
        run: |
          npx supabase start
          npx supabase db reset --local
          source <(npx supabase status -o env)
          echo "SHAREAT_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SHAREAT_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Run end-to-end tests
        run: ./gradlew :shared:data:jvmTest --rerun-tasks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: shared/data/build/reports/tests/
          if-no-files-found: ignore

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk


  build-ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    needs: [test, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
          -project iosApp/iosApp.xcodeproj \
          -configuration Debug \
          -scheme iosApp \
          -sdk iphonesimulator \
          -arch arm64 \
          -derivedDataPath ./build \
          -verbose \
          CODE_SIGNING_ALLOWED=NO

      - name: Upload App Folder
        uses: actions/upload-artifact@v4
        with:
          name: iphonesimulator-app
          path: build/Build/Products/Debug-iphonesimulator/*

  build-wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Wasm distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Upload Wasm app
        uses: actions/upload-artifact@v4
        with:
          name: wasm-app
          path: webApp/build/dist/wasmJs/productionExecutable/
