name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: User-visible version; leave empty to use 1.0.0
        required: false
        type: string
      destination:
        description: Where to send the signed build
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - internal-sharing
          - internal

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    env:
      SHAREAT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      SHAREAT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          version_code="$(date -u +%s)"
          version_name="${INPUT_VERSION_NAME:-1.0.0}"

          if (( version_code > 2100000000 )); then
            echo "Generated version code exceeds the Google Play limit" >&2
            exit 1
          fi
          if [[ ! "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "version_name contains unsupported characters" >&2
            exit 1
          fi

          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

          {
            echo "### Android release metadata"
            echo "- Version code: \`$version_code\`"
            echo "- Version name: \`$version_name\`"
            echo "- Destination: \`${{ inputs.destination }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/shareat-upload.jks

      - name: Validate upload keystore
        shell: bash
        run: |
          if [[ -z "$SHAREAT_UPLOAD_STORE_PASSWORD" || -z "$SHAREAT_UPLOAD_KEY_PASSWORD" ]]; then
            echo "Android signing password secrets are not configured" >&2
            exit 1
          fi
          keytool -list \
            -keystore keystore/shareat-upload.jks \
            -storepass:env SHAREAT_UPLOAD_STORE_PASSWORD \
            -alias shareat-upload > /dev/null

      - name: Build signed APK and AAB
        shell: bash
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          ./gradlew \
            :androidApp:assembleRelease \
            :androidApp:bundleRelease \
            -Pshareat.versionCode="$VERSION_CODE" \
            -Pshareat.versionName="$VERSION_NAME" \
            -Pshareat.revenuecat.production.androidApiKey="$REVENUECAT_ANDROID_API_KEY"

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: shareat-android-${{ steps.release.outputs.version_name }}-${{ steps.release.outputs.version_code }}
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Restore Google Play credentials
        if: inputs.destination != 'artifact'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"

      - name: Upload to Google Play Internal App Sharing
        if: inputs.destination == 'internal-sharing'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play-service-account.json
          packageName: org.shareat.app
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: internalsharing

      - name: Upload to Google Play internal testing
        if: inputs.destination == 'internal'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play-service-account.json
          packageName: org.shareat.app
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
